<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEH Login</title>
    <link rel="stylesheet" href="login.css">
    <style>
        /* 1. FONTS */
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');


/* =========================================================
   2. RESET - browser ki default styling hatane ke liye
   ========================================================= */
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    font-family: "Plus Jakarta Sans", sans-serif;
    background: #faf9f6;
    color: #111827;
}

button,
input {
    font: inherit;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

button {
    border: 0;
}


/* =========================================================
   3. LOGIN PAGE (poora screen + background glow)
   ========================================================= */
.login-page {
    min-height: 100vh;
    min-height: 100svh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 32px 48px;
    background: #faf9f6;
}

/* ---------- Login Page - Background Glow (common) ---------- */
.background-glow {
    position: absolute;
    pointer-events: none;
    border-radius: 9999px;
    z-index: 0;
}

/* Glow - upar left corner */
.background-glow--top-left {
    width: 384px;
    height: 384px;
    top: -128px;
    left: -128px;
    background: rgba(253, 230, 138, 0.3);
    filter: blur(60px);
}

/* Glow - right side, beech me */
.background-glow--right {
    width: 420px;
    height: 420px;
    right: -192px;
    top: calc(50% + 0px);
    transform: translateY(-50%);
    background: rgba(254, 215, 170, 0.25);
    filter: blur(70px);
}

/* Glow - neeche ki taraf */
.background-glow--bottom {
    height: 320px;
    left: 33.33%;
    right: 41.67%;
    bottom: -95.5px;
    background: rgba(254, 243, 199, 0.4);
    filter: blur(50px);
}


/* =========================================================
   4. LOGIN CARD (beech wala white box)
   ========================================================= */
.login-card {
    position: relative;
    z-index: 1;
    width: min(561px, 100%);
    min-height: 560.875px;
    padding: 48px 47.62px 32px 48px;
    background: #fff;
    border: 1px solid #e8e4dc;
    border-radius: 16px;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
}

/* Login card - upar ki patli golden line (gradient) */
.login-card::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 25.08%;
    right: 25.08%;
    height: 2px;
    background: linear-gradient(90deg, rgba(202, 138, 4, 0), rgba(202, 138, 4, 0.5) 50%, rgba(202, 138, 4, 0));
}

/* ---------- Login Card - Header (logo + heading) ---------- */
.card-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
}

/* Card header - Logo */
.card-logo {
    width: 110px;
    height: 40px;
    display: block;
}

.card-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Card header - Heading ("Welcome Back to CEH" + "Sign in to look more") */
.card-heading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.card-heading h1 {
    margin: 0;
    font-family: "EB Garamond", serif;
    font-size: 26px;
    line-height: 32px;
    font-weight: 600;
    letter-spacing: -0.65px;
    color: #111827;
    text-align: center;
}

.card-heading p {
    margin: 0;
    color: #4b5563;
    font-size: 14px;
    line-height: 20px;
    text-align: center;
}


/* =========================================================
   5. LOGIN TYPE SWITCH (Student / Admin)
   ========================================================= */
/* heading aur switch ke beech ka gap yahi se control hota hai (margin-top) */
.login-type-switch {
    width: 100%;
    margin-top: 32px;
    padding: 5px;
    display: flex;
    align-items: center;
    background: #f4f2ee;
    border: 1px solid #e5e1d8;
    border-radius: 9999px;
}

/* ---------- Login Type Switch - Button ---------- */
.login-type-btn {
    flex: 1;
    min-width: 0;
    min-height: 40px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 9999px;
    background: transparent;
    color: #514535;
    cursor: pointer;
    font-size: 14px;
    line-height: 20px;
    font-weight: 600;
    white-space: nowrap;
}

.login-type-btn img {
    width: auto;
    height: auto;
    max-width: 17px;
    max-height: 16px;
}

/* Login type button - selected (golden) */
.login-type-btn--active {
    background: #ca8a04;
    color: #fff;
    box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05);
}


/* =========================================================
   6. LOGIN FORM
   ========================================================= */
.login-form {
    width: 100%;
    margin-top: 38px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* ---------- Login Form - Field (label + input) ---------- */
.form-field {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* Form field - label wali row (left: label, right: hint/link) */
.form-field__label-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.form-field__label-row label {
    color: #111827;
    font-size: 12px;
    line-height: 16px;
    font-weight: 700;
    letter-spacing: 0.6px;
}

/* Form field - "verified id only" (grey hint) */
.form-field__hint {
    color: #837562;
    font-size: 12px;
    line-height: 16px;
    letter-spacing: 0.6px;
    white-space: nowrap;
}

/* Form field - "Login via Fast OTP" (golden underlined link) */
.form-field__link {
    color: #ca8a04;
    font-size: 12px;
    line-height: 16px;
    font-weight: 600;
    letter-spacing: 0;
    text-decoration: underline;
    text-underline-position: from-font;
    white-space: nowrap;
}

/* ---------- Login Form - Input Box (icon + input) ---------- */
.input-box {
    position: relative;
    width: 100%;
    min-height: 50px;
}

.input-box input {
    width: 100%;
    height: 50px;
    padding: 16px 49px 16px 49px;
    border: 1px solid #d5c4ae;
    border-radius: 9999px;
    outline: none;
    background: #fbf9f5;
    color: #4b5563;
    font-size: 14px;
    line-height: normal;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}

.input-box input::placeholder {
    color: rgba(131, 117, 98, 0.7);
    opacity: 1;
}

/* Input box - focus hone par golden border */
.input-box input:focus {
    border-color: #ca8a04;
}

/* Input box - left side icon */
.input-box__icon {
    position: absolute;
    z-index: 2;
    width: 16.67px;
    height: 16.67px;
    left: 17.66px;
    top: 16.67px;
    pointer-events: none;
}

/* Input box - password field ka lock icon (size/position alag) */
.input-box__icon--password {
    width: 13.33px;
    height: 17.5px;
    left: 19.34px;
    top: 15.83px;
}

/* Input box - right side aankh wala button */
.password-eye-btn {
    position: absolute;
    z-index: 2;
    top: 11px;
    right: 16px;
    width: 26px;
    height: 26px;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    cursor: pointer;
}

.password-eye-btn img {
    width: 18.33px;
    height: 12.5px;
}

/* ---------- Login Form - Options (Remember me) ---------- */
.form-options {
    width: 100%;
    padding: 1px 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
}

.remember-me {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #4b5563;
    font-size: 14px;
    line-height: 20px;
    cursor: pointer;
}

/* asli checkbox chhupa hua hai, uski jagah neeche wala golden box dikhta hai */
.remember-me input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.remember-me__box {
    width: 18px;
    height: 18px;
    padding: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 4px;
    background: #ca8a04;
}

.remember-me__box img {
    width: 16px;
    height: 16px;
}

/* Form options - biometric button (abhi HTML me use nahi hai, future ke liye rakha hai) */
.biometric-btn {
    padding: 7px 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid #e5e1d8;
    border-radius: 9999px;
    background: #f4f2ee;
    color: #904d00;
    font-size: 12px;
    line-height: 16px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}

.biometric-btn img {
    width: 13.54px;
    height: 14.97px;
}

/* ---------- Login Form - Sign In Button ---------- */
.sign-in-btn {
    width: 100%;
    min-height: 56px;
    margin-top: 8px;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border-radius: 9999px;
    background: linear-gradient(90deg, #ca8a04 0%, #e17d11 50%, #ca8a04 100%);
    color: #fff;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    cursor: pointer;
    font-size: 16px;
    line-height: 24px;
    font-weight: 600;
    letter-spacing: 0.4px;
}

.sign-in-btn img {
    width: 13.33px;
    height: 13.33px;
}


/* =========================================================
   7. REGISTER TEXT ("Don't have an account? Register for CEH")
   ========================================================= */
.register-text {
    width: 100%;
    margin-top: 24px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 4px;
    color: #4b5563;
    font-size: 14px;
    line-height: 20px;
    text-align: center;
    white-space: nowrap;
}

.register-text a {
    color: #ca8a04;
    font-weight: 600;
    text-decoration: none;
}


/* =========================================================
   8. RESPONSIVE - bade se chhote screen tak
   ========================================================= */

/* ---------- Tablet / bada phone (max 700px) ---------- */
@media (max-width: 700px) {
    .login-page {
        padding: 24px 16px;
        overflow-y: auto;
    }

    .login-card {
        width: 100%;
        min-height: auto;
        padding: 36px 24px 28px;
    }

    .login-type-switch {
        margin-top: 24px;
    }

    .login-type-btn {
        padding: 10px 8px;
        font-size: 12px;
    }

    .form-field__label-row {
        align-items: flex-start;
    }

    .form-field__label-row label {
        max-width: 70%;
    }

    .register-text {
        white-space: normal;
        flex-wrap: wrap;
    }
}

/* ---------- Phone (max 480px) ---------- */
@media (max-width: 480px) {
    .login-page {
        padding: 16px 10px;
    }

    .login-card {
        padding: 30px 18px 24px;
        border-radius: 14px;
    }

    .card-heading h1 {
        font-size: 24px;
    }

    .login-type-switch {
        margin-top: 20px;
    }

    .login-type-btn {
        gap: 5px;
        padding: 9px 5px;
        font-size: 10.5px;
    }

    .login-type-btn img {
        max-width: 14px;
        max-height: 14px;
    }

    .login-form {
        margin-top: 30px;
    }

    .form-field__label-row {
        gap: 8px;
    }

    .form-field__label-row label,
    .form-field__hint,
    .form-field__link {
        font-size: 10px;
        letter-spacing: 0.3px;
    }

    .input-box input {
        height: 48px;
        padding-left: 45px;
        padding-right: 44px;
    }

    .input-box__icon {
        left: 15px;
    }

    .input-box__icon--password {
        left: 17px;
    }

    .password-eye-btn {
        right: 12px;
    }

    .form-options {
        align-items: center;
    }

    .remember-me {
        gap: 7px;
        font-size: 12px;
    }

    .biometric-btn {
        padding: 6px 9px;
        font-size: 10px;
    }

    .sign-in-btn {
        min-height: 52px;
        font-size: 14px;
    }
}

/* ---------- Chhota phone (max 360px) ---------- */
@media (max-width: 360px) {
    .login-card {
        padding-left: 14px;
        padding-right: 14px;
    }

    .login-type-btn {
        font-size: 9.5px;
    }

    .form-field__label-row {
        flex-direction: column;
        gap: 2px;
    }

    .form-field__label-row label {
        max-width: 100%;
    }

    .form-options {
        flex-direction: column;
        align-items: stretch;
    }

    .biometric-btn {
        align-self: flex-end;
    }
}
    </style>
</head>
<body>

    <!-- ===================== LOGIN PAGE (poora screen) ===================== -->
    <main class="login-page">

        <!-- Background ke 3 blur wale golden glow (sirf design ke liye) -->
        <div class="background-glow background-glow--top-left"></div>
        <div class="background-glow background-glow--right"></div>
        <div class="background-glow background-glow--bottom"></div>

        <!-- ===================== LOGIN CARD (beech wala white box) ===================== -->
        <section class="login-card">

            <!-- Card ka upar wala hissa: logo + heading -->
            <div class="card-header">
                <a href="#" class="card-logo">
                    <img src="ceh-for-dark.png" alt="Campus Event Hub">
                </a>

                <div class="card-heading">
                    <h1>Welcome Back to CEH</h1>
                    <p>Sign in to look more</p>
                </div>
            </div>

            <!-- Login type switch: Student ya Admin chuno -->
            <div class="login-type-switch">
                <!-- Student login (abhi selected) -->
                <button class="login-type-btn login-type-btn--active" type="button">
                    <img src="https://www.figma.com/api/mcp/asset/344feeaa-cfd3-4a21-bb27-db2707ff1199.svg" alt="">
                    <span>Student / Attendee Login</span>
                </button>

                <!-- Admin login -->
                <button class="login-type-btn" type="button">
                    <img src="https://www.figma.com/api/mcp/asset/44c3ff2f-7e73-485c-9d88-1ec9c22089f2.svg" alt="">
                    <span>Admin / Coordinator Login</span>
                </button>
            </div>

            <!-- ===================== LOGIN FORM ===================== -->
            <form class="login-form" action="index.html" method="get">

                <!-- Field 1: Enrollment number / email -->
                <div class="form-field">
                    <div class="form-field__label-row">
                        <label for="enrollment">ENROLLMENT NUMBER / UNIVERSITY EMAIL</label>
                        <span class="form-field__hint">verified id only</span>
                    </div>

                    <div class="input-box">
                        <img class="input-box__icon" src="https://www.figma.com/api/mcp/asset/acef0b78-4925-4e05-9045-3f760d8bece1.svg" alt="">
                        <input id="enrollment" type="text" placeholder="e.g. 202300412 or shivam@campus.edu">
                    </div>
                </div>

                <!-- Field 2: Password / OTP -->
                <div class="form-field">
                    <div class="form-field__label-row">
                        <label for="password">PASSWORD / OTP PASSCODE</label>
                        <a class="form-field__link" href="#">Login via Fast OTP</a>
                    </div>

                    <div class="input-box">
                        <img class="input-box__icon input-box__icon--password" src="https://www.figma.com/api/mcp/asset/9796463c-4cd4-4e5b-82f1-8d3c176d8ead.svg" alt="">
                        <input id="password" type="password" placeholder="••••••••••••">
                        <!-- Aankh wala button: password dikhane/chhupane ke liye -->
                        <button class="password-eye-btn" type="button" aria-label="Toggle password visibility">
                            <img src="https://www.figma.com/api/mcp/asset/a40add7a-237d-4bb7-8d97-69f2d3b5f953.svg" alt="">
                        </button>
                    </div>
                </div>

                <!-- Remember me checkbox -->
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" checked>
                        <span class="remember-me__box">
                            <img src="https://www.figma.com/api/mcp/asset/17c2d2f7-8af0-4100-9416-8f8baf7f837c.svg" alt="">
                        </span>
                        <span>Remember me</span>
                    </label>
                </div>

                <!-- Sign in button -->
                 
                
                <button class="sign-in-btn" type="submit">
                    <span>Sign In &amp; Access Passes</span>
                    <img src="https://www.figma.com/api/mcp/asset/a9df05b1-8b60-40e2-ba83-201aceb72497.svg" alt="">
                </button>
                
            </form>

            <!-- Card ke neeche: naya account banane ka link -->
            <div class="register-text">
                <span>Don't have an account?</span>
                <a href="#">Register for CEH</a>
            </div>
        </section>
    </main>
</body>
</html>
